server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/boardgames
    username: chess
    password: chess
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  application:
    name: boardgames-server